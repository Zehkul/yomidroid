name: Build & Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Hash compiler contents rather than mtime so the ccache stays valid across runs
      # (setup-android reinstalls the NDK each run, changing binary mtimes).
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up ccache (caches the llama.cpp/NDK native compile)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-ndk26-arm64
          max-size: 500M

      - name: Decode release keystore
        # Skip when the secret is missing (fork PRs). Unsigned release still builds.
        id: keystore
        env:
          YOMIDROID_KEYSTORE_BASE64: ${{ secrets.YOMIDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${YOMIDROID_KEYSTORE_BASE64}" ]; then
            echo "No keystore secret — building unsigned release APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/yomidroid-release.jks"
          echo "${YOMIDROID_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          ls -la "${KEYSTORE_PATH}"

      - name: Build release APK
        env:
          YOMIDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          YOMIDROID_KEYSTORE_PASSWORD: ${{ secrets.YOMIDROID_KEYSTORE_PASSWORD }}
          YOMIDROID_KEY_ALIAS: ${{ secrets.YOMIDROID_KEY_ALIAS }}
          YOMIDROID_KEY_PASSWORD: ${{ secrets.YOMIDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Compute APK metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%d)"
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              SUFFIX="pr${{ github.event.pull_request.number }}-${SHORT_SHA}"
              LABEL="PR #${{ github.event.pull_request.number }} · ${SHORT_SHA}"
              ;;
            push)
              SUFFIX="${DATE}-${SHORT_SHA}"
              LABEL="${DATE} · ${SHORT_SHA}"
              ;;
            *)
              SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"
              SUFFIX="${SLUG}-${SHORT_SHA}"
              LABEL="${SLUG} · ${SHORT_SHA}"
              ;;
          esac
          APK="yomidroid-${SUFFIX}.apk"
          TAG="build-${DATE}-${SHORT_SHA}"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "date=${DATE}"
            echo "suffix=${SUFFIX}"
            echo "apk=${APK}"
            echo "tag=${TAG}"
            echo "label=${LABEL}"
          } >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # Prefer the signed release output; fall back to the unsigned package.
          SRC=""
          for candidate in \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          do
            if [ -f "$candidate" ]; then
              SRC="$candidate"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "No release APK found under app/build/outputs/apk/release/"
            ls -laR app/build/outputs/apk/ || true
            exit 1
          fi
          cp "$SRC" "dist/${APK}"
          ls -la dist/
          # Record whether the APK is signed for the release notes.
          if apksigner verify --print-certs "dist/${APK}" >/dev/null 2>&1 \
              || "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "dist/${APK}" >/dev/null 2>&1; then
            echo "apk_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: dist/${{ steps.meta.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.meta.outputs.apk }}
          LABEL: ${{ steps.meta.outputs.label }}
          APK_SIGNED: ${{ steps.meta.outputs.apk_signed }}
        run: |
          if [ "${APK_SIGNED}" = "true" ]; then
            SIGNING_NOTE="**Release-signed** — install via \`adb install -r\` or by enabling \"Install unknown apps\". Same signing key upgrades previous release builds."
          else
            SIGNING_NOTE="**Unsigned release** — no keystore secret on this run. Sideload only; cannot upgrade a previously signed install."
          fi
          NOTES=$(cat <<EOF
          Auto-built from \`main\` @ ${LABEL}.

          ${SIGNING_NOTE}

          Release builds have \`BuildConfig.DEBUG=false\`, so manga-ocr crop debug dumps are disabled.

          On first launch, open Settings → Dictionaries to import a Yomitan ZIP or download from the recommended catalog.
          EOF
          )

          gh release create "${TAG}" \
            "dist/${APK}" \
            --title "Yomidroid ${LABEL}" \
            --target "${GITHUB_SHA}" \
            --notes "${NOTES}"
